    <style>
        @font-face {
            src: url('fonts/Sga-Regular.woff2') format('woff2'),
                 url('fonts/Sga-Regular.woff') format('woff'),
                 url('fonts/Sga-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-family: 'Sga Regular';
        }

        body {
            font-family: 'Sga Regular', Arial, sans-serif;
            color: #00ff00;
            background: black;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 2;
            font-size: 32px;
            color: #00ff00;
        }

        #bubble-pop-game {
            position: relative;
            z-index: 1;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            text-align: center;
            width: 80%;
            max-width: 800px;
            height: 80%;
            max-height: 600px;
            box-shadow: 0 0 20px #00ff00;
            border: 2px solid #00ff00;
        }
    </style>
    <script src="planets.js"></script>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div id="loading-screen">Click any key to start</div>
    <div id="bubble-pop-game" style="display: none;">
        <canvas id="bubbleCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        // Starfield background
        const starCanvas = document.getElementById('starfield');
        const starContext = starCanvas.getContext('2d');
        starCanvas.width = window.innerWidth;
        starCanvas.height = window.innerHeight;

        let stars = [];
        const numStars = 1000;
        const speed = 0.05;

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * starCanvas.width,
                y: Math.random() * starCanvas.height,
                z: Math.random() * starCanvas.width
            });
        }

        function updateStars() {
            for (let star of stars) {
                star.z -= speed;
                if (star.z <= 0) {
                    star.x = Math.random() * starCanvas.width;
                    star.y = Math.random() * starCanvas.height;
                    star.z = starCanvas.width;
                }
            }
        }

        function drawStars() {
            starContext.clearRect(0, 0, starCanvas.width, starCanvas.height);
            for (let star of stars) {
                const x = (star.x - starCanvas.width / 2) * (starCanvas.width / star.z);
                const y = (star.y - starCanvas.height / 2) * (starCanvas.width / star.z);
                const size = (starCanvas.width / star.z) * 0.5;
                starContext.beginPath();
                starContext.arc(x + starCanvas.width / 2, y + starCanvas.height / 2, size, 0, Math.PI * 2);
                starContext.fillStyle = '#ffffff';
                starContext.fill();
                starContext.closePath();
            }
        }

        function animateStars() {
            updateStars();
            drawStars();
            requestAnimationFrame(animateStars);
        }

        animateStars();

        // Bubble pop typing tutor functionality
        const bubbleCanvas = document.getElementById('bubbleCanvas');
        const context = bubbleCanvas.getContext('2d');
        bubbleCanvas.width = 800;
        bubbleCanvas.height = 600;
        context.font = "40px 'Sga Regular'";

        let isUsingCustomFont = true;
        let isGameStarted = false;
        let score = 0;

        let spaceship = {
            x: bubbleCanvas.width / 2,
            y: bubbleCanvas.height / 2,
            angle: 0
        };

        let words = [
            "inference", "predictive", "coding", "hierarchical", "assembly", "theory", "active",
            "model", "representation", "perception", "prediction", "error", "minimization",
            "feedback", "feedforward", "information", "processing", "Bayesian", "framework",
            "cognition", "learning", "adaptation", "dynamics", "probabilistic", "state",
            "estimation", "entropy", "surprise", "precision", "weighting", "neuronal",
            "circuit", "computational", "brain", "function", "sensory", "motor", "system",
            "control", "action", "policy", "generation", "belief", "update", "context",
            "situation", "awareness", "decision", "making", "free", "energy", "principle",
            "Markov", "blanket", "affordance", "embodied", "enactive", "interoception",
            "exteroception", "self", "organization", "autopoiesis", "plasticity", "synaptic",
            "connectivity", "neurotransmitter", "modulation", "stochastic", "gradient",
            "descent", "optimization", "attention", "salience", "mapping", "prior", "posterior",
            "predictor", "residual", "variance", "confidence", "interval", "signal", "noise",
            "ratio", "temporal", "spatial", "resolution", "ensemble", "dynamics", "complex",
            "system", "nonlinear", "chaos", "fractal", "structure", "scaling", "laws", "emergent",
            "property", "integration", "segmentation", "binding", "inference", "loop", "recurrence",
            "autonomy", "homeostasis", "equilibrium", "disequilibrium", "perturbation", "transformation",
            "modelling", "simulation", "virtual", "reality", "extended", "multisensory", "fusion",
            "neural", "oscillation", "synchrony", "desynchronization", "phase", "locking",
            "entrainment", "coherence", "transient", "persistent", "activation", "threshold",
            "modulatory", "inhibitory", "excitatory", "balance", "homeodynamic", "regulation"
        ];

        let bubbles = [];
        let typedWord = '';
        let level = 1;
        let maxBubbles = 3;
        let isGameOver = false;
        let isLoading = false;

        function createBubbles() {
            bubbles = [];
            for (let i = 0; i < maxBubbles; i++) {
                let word = words[Math.floor(Math.random() * words.length)];
                let bubbleSize = 20;
                let wordLength = word.length * 20; // Approximate width based on font size

                // Ensure bubbles are not too close to edges
                let x = Math.random() * (bubbleCanvas.width - wordLength - bubbleSize * 2) + wordLength / 2 + bubbleSize;
                let y = Math.random() * (bubbleCanvas.height - bubbleSize * 2) + bubbleSize;

                bubbles.push({
                    x: x,
                    y: y,
                    size: bubbleSize,
                    speed: 0.05, // Adjusted speed for slower expansion
                    word: word,
                    typed: ''
                });
            }
        }

        function draw() {
            context.fillStyle = "#000000";
            context.fillRect(0, 0, bubbleCanvas.width, bubbleCanvas.height);

            if (isGameOver) {
                context.fillStyle = "#FF0000";
                context.fillText("Planetary Crash Warning! Game Over!", bubbleCanvas.width / 2 - 200, bubbleCanvas.height / 2);
                return;
            }

            if (isLoading) {
                context.fillStyle = "#FFFFFF";
                context.fillText("Loading next level...", bubbleCanvas.width / 2 - 150, bubbleCanvas.height / 2);
                return;
            }

            context.fillStyle = "#FFFFFF";
            context.fillText("Level: " + level, 10, 50);
            context.fillText("Score: " + score, 10, 90);
            context.fillText(isUsingCustomFont ? "Control+Z: Toggle Latin" : "Control+Z: Toggle SGA", bubbleCanvas.width - 350, 50);

            for (let bubble of bubbles) {
                let scale = bubble.size / 20;
                let x = bubble.x;
                let y = bubble.y;

                context.strokeStyle = "#ffffff";
                context.beginPath();
                context.arc(x, y, bubble.size * scale, 0, Math.PI * 2);
                context.fillStyle = "#000";
                context.fill();
                context.closePath();
                context.stroke();

                // Draw word with correct letters in green
                for (let i = 0; i < bubble.word.length; i++) {
                    context.fillStyle = (i < bubble.typed.length) ? "#00FF00" : "#ffffff";
                    context.fillText(bubble.word[i], x - bubble.word.length * 20 / 2 + i * 20, y + 10);
                }
            }
        }

        function update() {
            for (let bubble of bubbles) {
                bubble.size += bubble.speed;

                if (bubble.size > bubbleCanvas.height) {
                    isGameOver = true;
                    return;
                }
            }
        }

        document.addEventListener("keydown", function(event) {
            if (!isGameStarted) {
                startGame();
                return;
            }

            if (event.ctrlKey && event.key === 'z') {
                toggleFont();
                return;
            }

            if (!isGameOver && !isLoading) {
                handleTyping(event.key);
            }
        });

        document.addEventListener("click", function() {
            if (!isGameStarted) {
                startGame();
            }
        });

        bubbleCanvas.addEventListener("click", function(event) {
            if (!isGameStarted) return;
            
            let rect = bubbleCanvas.getBoundingClientRect();
            let x = event.clientX - rect.left;
            let y = event.clientY - rect.top;

            handleTap(x, y);
        });

        function handleTap(x, y) {
            let tappedBubble = bubbles.find(bubble => {
                let scale = bubble.size / 20;
                let bubbleX = bubble.x;
                let bubbleY = bubble.y;
                let bubbleRadius = bubble.size * scale;
                return Math.hypot(bubbleX - x, bubbleY - y) < bubbleRadius;
            });

            if (tappedBubble) {
                explodeBubbles([tappedBubble.word]);
            }
        }

        function handleTyping(key) {
            typedWord += key;
            let matchingBubbles = bubbles.filter(bubble => bubble.word.startsWith(typedWord));

            if (matchingBubbles.length > 0) {
                for (let bubble of matchingBubbles) {
                    bubble.typed = typedWord;
                }

                let completeBubbles = matchingBubbles.filter(bubble => bubble.word === typedWord);

                if (completeBubbles.length > 0) {
                    explodeBubbles(completeBubbles.map(bubble => bubble.word));
                }
            } else {
                typedWord = '';
                for (let bubble of bubbles) {
                    bubble.typed = '';
                }
            }
        }

        function explodeBubbles(words) {
            bubbles = bubbles.filter(bubble => !words.includes(bubble.word));
            typedWord = '';
            score += words.length;

            if (bubbles.length === 0) {
                isLoading = true;
                setTimeout(() => {
                    level++;
                    maxBubbles++;
                    createBubbles();
                    isLoading = false;
                }, 2000);
            }
        }

        function resetGame() {
            level = 1;
            maxBubbles = 3;
            isGameOver = false;
            score = 0;
            createBubbles();
        }

        function toggleFont() {
            if (isUsingCustomFont) {
                document.body.style.fontFamily = "sans-serif";
                context.font = "40px sans-serif";
                isUsingCustomFont = false;
            } else {
                document.body.style.fontFamily = "Sga Regular";
                context.font = "40px 'Sga Regular'";
                isUsingCustomFont = true;
            }
        }

        function startGame() {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('bubble-pop-game').style.display = 'block';
            isGameStarted = true;
            resetGame();
            loop();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
<!-- 
    Concept Note: Grabby Bubbles and the Cost of Inattention

    Each bubble in this game stands in for an expanding process, the kind
    described in Robin Hanson's "grabby aliens" hypothesis in astrobiology:
    a civilization, or here a single growing claim on the screen, that
    does not slow itself down. Left alone, a bubble's radius increases at
    a constant rate every frame, indifferent to what else is happening
    around it, indifferent to how many other bubbles are also growing,
    indifferent to whether the player is watching it or one of the others.
    Growth here carries no internal brake. The only thing that stops a
    bubble is an external act, the player typing its word correctly and
    popping it, which is a way of saying that in this toy model, expansion
    is default and containment is the thing that has to be earned through
    attention and correct action.

    This maps onto the "grabby" half of Hanson's dichotomy specifically.
    Hanson contrasts grabby civilizations, which expand rapidly, visibly,
    and irreversibly, with quiet ones, which either never expand past
    their home system or expand slowly enough, and covertly enough, that
    an outside observer would be unlikely to notice them at all before
    they arrive. A grabby civilization is loud by construction: it is
    only inferable from the outside because it changes the volume of
    space it occupies fast enough to leave a detectable trace. The bubbles
    in this game are grabby in exactly that sense. Nothing here is a
    quiet, deniable process; every bubble broadcasts its own existence and
    its own rate of expansion continuously, on the screen, in front of the
    player, by design. There is no failure mode in this model where a
    bubble expands and nobody notices. The whole mechanic assumes full
    visibility and asks whether the player can act on that visibility
    fast enough.

    The vocabulary populating the bubbles is drawn from predictive coding,
    active inference, and free energy principle literature: precision
    weighting, Markov blanket, homeostasis, prediction error minimization,
    and so on. This is not incidental set dressing. Predictive coding
    treats a cognitive system as one that is constantly generating
    predictions about its sensory stream and updating either its model or
    its actions to minimize the mismatch, the prediction error, between
    what it expected and what it received. An unaddressed prediction
    error is structurally similar to an unaddressed bubble: both are a
    live discrepancy that, left untouched, does not resolve itself and
    does not shrink on its own. Some formulations of active inference
    describe the organism as acting specifically to keep its own model's
    surprise, its free energy, bounded within a survivable range, the
    same way the player here is not trying to eliminate every bubble
    permanently, only to keep the total field of active bubbles inside
    the boundary of the screen. The game's failure condition, a bubble
    growing past the edge of the canvas, is a crude but legible analogue
    of an organism's model failing to contain its own error, of precision
    weighting failing to keep pace with the rate at which discrepancy
    accumulates.

    There is a second, more ecological reading available as well, closer
    to Hanson's own framing of expansion under resource constraint than to
    the cognitive-science vocabulary populating the bubbles. In Hanson's
    model, expansion is not itself pathological; it becomes a problem for
    an observer, or for a neighboring civilization, only once it starts
    consuming a shared resource, physical volume, available matter, or in
    this game's case, canvas area, that other agents also depend on. A
    single bubble expanding on an otherwise empty screen is not
    threatening. It becomes threatening only in the presence of a finite
    boundary and, implicitly, of other bubbles competing for the same
    finite space. This is the same logistic-growth logic behind carrying
    capacity in ecology: nothing expands without limit, because
    everything either meets its own resource ceiling or collides with
    another agent's claim on the same resource first. The typing
    mechanic is, in this reading, a stand-in for exactly the kind of
    external constraint, another agent, competition, an environmental
    ceiling, that keeps any single expanding process from running away
    unchecked. The player is not outside the ecology being modeled. The
    player is the check the ecology needs in order to remain an ecology
    rather than a single winner-take-all bubble consuming the entire
    screen.

    None of this requires reading the game as a serious model of anything
    beyond itself, and it should not be read as such. It is a small,
    campy vocabulary drill wearing a science-fiction skin, in keeping
    with a long tradition of exactly that kind of borrowing, from
    Pinky and the Brain's nightly failed plots to Hanson's own
    admittedly speculative and provocative public writing on grabby
    civilizations. The concept note exists to make explicit what the
    mechanic is quietly already doing: using unchecked growth as a
    simple, visually legible proxy for the cost of inattention, whether
    that inattention is a player's, a cognitive system's, or a
    civilization's, and using the act of typing correctly, precisely,
    under time pressure, as a simple proxy for the cost of the attention
    that keeps growth from becoming domination.
-->
</body>
